name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      # Catch build-only breakage (shebang, version injection, chmod) that
      # unit tests never touch: they import bin/, not dist/.
      - run: npm run build
      - run: node dist/cc-launch.mjs --help
